[build-system]
requires = ["setuptools>=69.0,<70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rentdesk-lite"
dynamic = ["version"]
description = "RentalDesk - offline equipment rental management (macOS/Windows)"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "PySide6==6.7.3",
    "openpyxl==3.1.5",
    "PyNaCl==1.5.0",
    # Windows에는 시스템 IANA 타임존 DB가 없으므로 zoneinfo("Asia/Seoul")용으로 고정
    "tzdata==2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "freezegun==1.5.1",
]
build = [
    "pyinstaller==6.10.0",
]

[tool.setuptools.dynamic]
version = { attr = "rentdesk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rentdesk.persistence.migrations" = ["*.sql"]
"rentdesk" = ["resources/icons/*.png", "resources/icons/*.svg", "resources/support/*.json", "resources/starter/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
