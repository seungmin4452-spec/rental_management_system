<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>메인 이미지</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 652px; height: 488px; overflow: hidden; }
  body {
    font-family: "Malgun Gothic", sans-serif;
    background: linear-gradient(150deg, #1B64DA 0%, #174EA6 100%);
    color: #fff; position: relative;
  }
  .text { position: absolute; left: 52px; top: 52px; width: 560px; }
  .tag {
    display: inline-block; font-size: 15px; font-weight: 700;
    background: rgba(255,255,255,.18); padding: 6px 12px; border-radius: 6px;
    letter-spacing: -0.2px;
  }
  h1 { margin-top: 16px; font-size: 40px; line-height: 1.22; font-weight: 800; letter-spacing: -1.4px; }
  .sub { margin-top: 12px; font-size: 17px; opacity: .92; letter-spacing: -0.4px; }
  .shot {
    position: absolute; left: 52px; top: 268px; width: 600px; height: 260px;
    border-radius: 10px 0 0 0; overflow: hidden;
    box-shadow: 0 -6px 30px rgba(0,0,0,.28);
    background: #fff;
  }
  .shot img { width: 600px; display: block; }
</style></head>
<body>
  <div class="text">
    <span class="tag">Windows 설치형 · 인터넷 없이 사용</span>
    <h1>렌탈샵 예약·반납·연체<br>관리 프로그램</h1>
    <p class="sub">중복 예약 차단 · 연체료 자동 계산 · 보증금 정산</p>
  </div>
  <div class="shot"><img src="img/dashboard.png" alt=""></div>
</body></html>
